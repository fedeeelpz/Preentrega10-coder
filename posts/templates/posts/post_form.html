{% extends 'posts/base.html' %}

{% block title %}
    {% if form.instance.pk %}Editar Post{% else %}Nuevo Post{% endif %}
{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Editar Post{% else %}Nuevo Post{% endif %}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
