{% extends 'posts/base.html' %}

{% block title %}Posts{% endblock %}

{% block content %}
    <h1>Posts</h1>

    {% for post in posts %}
        <article>
            <h2>{{ post.titulo }}</h2>
            <p><strong>Autor:</strong> {{ post.autor }}</p>
            <p><strong>Estado:</strong> {{ post.estado }}</p>
            <p><strong>Publicado el:</strong> {{ post.fecha_creacion }}</p>
            <p>{{ post.contenido }}</p>
        </article>
        <hr>
    {% endfor %}
{% endblock %}
